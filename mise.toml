[tools]
python = "3.14"

[env]
PYTHONPATH = "."

[tasks.install]
description = "Install dependencies"
run = "python -m pip install -e . && python -m pip install mkdocs-material pymdown-extensions pytest"

[tasks.test]
description = "Run test suite"
run = "python -m pytest tests/"

[tasks.demo]
description = "Run demo script and generate demo.html"
run = "python demo.py"

[tasks.docs]
description = "Serve documentation site"
run = "mkdocs serve"

[tasks.run_windows]
description = "Run full development cycle and open demo on Windows CMD"
run = [
    "python -m pip install -e .",
    "python -m pip install mkdocs-material pymdown-extensions pytest",
    "python -m pytest tests/",
    "python demo.py",
    "start demo.html"
]

[tasks.clean]
description = "Remove generated files (Windows compatible)"
run = "python -c \"import os, shutil; [os.remove(f) for f in ['demo.html'] if os.path.exists(f)]; [shutil.rmtree(d) for d in ['site', '.pytest_cache'] if os.path.exists(d)]\""
