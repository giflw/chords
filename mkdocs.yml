site_name: ChordsMD Documentation
site_description: Documentation for the ChordsMD Python Markdown extension suite.
site_author: ChordsMD Team

theme:
  name: material
  palette:
    scheme: default
    primary: indigo
    accent: indigo
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy

markdown_extensions:
  - attr_list
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - chordsmd:
      chords: true
      tabs: true
      abc: true
      chordpro: true
      fountain: true
      strumming: true
      diagrams: true
      asciidoc: true

extra_css:
  - assets/style/style.css

extra_javascript:
  - assets/vendor/svguitar.umd.js
  - https://cdnjs.cloudflare.com/ajax/libs/abcjs/6.2.2/abcjs-basic-min.js

nav:
  - Home: index.md
  - Cheat Sheet: cheat_sheet.md
  - Format Reference:
      - Chord Sheets: chords.md
      - Tablature: tabs.md
      - ChordPro: chordpro.md
      - Fountain Screenplay: fountain.md
      - Strumming Patterns: strumming.md
      - Chord Diagrams: diagrams.md
      - Text Formatting: asciidoc.md
