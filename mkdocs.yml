site_name: ChordsMD Documentation
site_description: Documentation for the ChordsMD Python Markdown extension suite.
site_author: ChordsMD Team

theme:
  name: material
  palette:
    scheme: default
    primary: indigo
    accent: indigo
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy

markdown_extensions:
  - attr_list
  - admonition
  - pymdownx.details
  - pymdownx.superfences

plugins:
  - chordsmd

nav:
  - Home: index.md
  - Cheat Sheet: cheat_sheet.md
  - Format Reference:
      - Chord Sheets: chords.md
      - Tablature: tabs.md
      - ABC Notation: abc.md
      - ChordPro: chordpro.md
      - Fountain Screenplay: fountain.md
      - Strumming Patterns: strumming.md
      - Chord Diagrams: diagrams.md
      - Text Formatting: asciidoc.md
